version: '3.8'

services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: docusphere-onlyoffice
    ports:
      - "8081:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-docusphere-dev-onlyoffice-secret}
      - JWT_HEADER=Authorization
    restart: always
